# Dogfooding: this repository runs its own gate against its own documentation.
#
# The split below is forced by GitHub, not by taste. A `pull_request` run from a
# fork gets no secrets, so it cannot reach a model. Structural detection is
# deterministic and needs no key, so every pull request gets it. Semantic
# detection costs money and needs a key, so it only runs where one exists.
name: Doc drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  # github/codeql-action reads the workflow run it is uploading for.
  actions: read

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: structural (no key required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The gate scopes itself to a committed range, so it needs the history
          # that contains the base commit.
          fetch-depth: 0

      - uses: ./
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          semantic: "false"
          # Not blocking yet: the first dogfood run surfaced 23 pre-existing
          # docstring findings in evaluation/benchmark_harness.py. Flip this to
          # "true" once they are repaired, so the repository is held to the
          # standard its own gate enforces.
          fail-on-drift: "false"
          version: .

  # Pull requests only. Semantic findings are review commentary, and there is
  # nobody left to inform once a commit is on main -- paying a model to annotate
  # merged code buys nothing. Forks are still excluded because they have no
  # access to the credential.
  semantic:
    name: semantic (pull requests, same-repo only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha }}
          semantic: "true"
          # Semantic findings are advisory here: recall is still being measured
          # (docs/evals), so they annotate rather than block.
          fail-on-drift: "false"
          upload-sarif: "false"
          version: .
        env:
          # Both are required: OpenRouterSettings.from_environment() needs a key
          # and a model, and supplying only the key fails the run with
          # openrouter_model_missing rather than degrading.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_PROVIDER: ${{ vars.OPENROUTER_PROVIDER }}
          # Langfuse is deliberately absent. `langfuse` is an optional extra
          # that uvx does not install here, so no client would exist to use the
          # credentials, and tracing belongs to eval runs and local development
          # rather than to a per-pull-request gate. Passing the variables anyway
          # would advertise tracing that never happens.
