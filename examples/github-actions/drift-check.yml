name: Documentation drift

on:
  pull_request:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"

      - name: Run read-only drift gate
        id: drift
        shell: bash
        env:
          # Pin this to a reviewed release tag or full commit in production.
          DRIFT_AGENT_SOURCE: git+https://github.com/ocensis/doc-drift-agent.git@main
          DRIFT_BASE: ${{ github.event.pull_request.base.sha }}
          DRIFT_ARTIFACT_DIR: ${{ runner.temp }}/drift-agent
          DRIFT_STATE_DIR: ${{ runner.temp }}/drift-agent-state
        run: |
          set +e
          uvx --from "$DRIFT_AGENT_SOURCE" drift-agent ci check \
            --repo "$GITHUB_WORKSPACE" \
            --since "$DRIFT_BASE" \
            --state-dir "$DRIFT_STATE_DIR" \
            --artifacts-dir "$DRIFT_ARTIFACT_DIR"
          drift_exit_code=$?
          echo "exit_code=$drift_exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add the human-readable job summary
        if: always()
        shell: bash
        env:
          DRIFT_SUMMARY: ${{ runner.temp }}/drift-agent/summary.md
        run: |
          if test -f "$DRIFT_SUMMARY"; then
            cat "$DRIFT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload drift artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doc-code-drift
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/drift-agent/bundle.json
            ${{ runner.temp }}/drift-agent/results.sarif
            ${{ runner.temp }}/drift-agent/summary.md
            ${{ runner.temp }}/drift-agent/pr-comment.md

      - name: Propagate the drift gate status
        if: always()
        shell: bash
        env:
          DRIFT_EXIT_CODE: ${{ steps.drift.outputs.exit_code }}
        run: |
          test -n "$DRIFT_EXIT_CODE"
          exit "$DRIFT_EXIT_CODE"
