name: Documentation drift gate
description: >-
  Run a read-only doc-code drift check over a committed range and surface the
  findings as SARIF code-scanning annotations.
author: doc-drift-agent

branding:
  icon: git-pull-request
  color: purple

inputs:
  base:
    description: >-
      Revision the range starts from. Defaults to the pull request base SHA,
      which is what makes the gate reproducible: the scope is a committed
      range, never the working tree.
    required: false
    default: ""
  repo:
    description: Repository checkout to inspect.
    required: false
    default: ${{ github.workspace }}
  semantic:
    description: >-
      Enable model-backed semantic detection. Off by default: it needs an API
      key, which pull_request runs from forks do not have, and it costs money
      per run. Structural detection is deterministic and free.
    required: false
    default: "false"
  fail-on-drift:
    description: >-
      Fail the job when a *blocking* finding is found -- one whose reason code
      asserts the documentation contradicts the code. Findings that only record
      that the detector could not verify a claim (`unsupported.*`,
      `ambiguity.*`) are advisory: they are annotated and counted, never
      blocking, because they fire on constructs the detector does not support
      and no documentation change removes them. Off by default so a new adopter
      gets annotations before a blocked merge. A tool malfunction (exit code 2)
      always fails regardless of this input.
    required: false
    default: "false"
  upload-sarif:
    description: >-
      Upload results.sarif to GitHub code scanning. Needs
      `permissions: security-events: write`.
    required: false
    default: "true"
  version:
    description: >-
      Package spec installed with uvx. Pinning the action with `uses: ...@ref`
      does not pin this -- it is a second, independent pointer at the Python
      package -- so the default tracks the same tag the action is released
      under rather than a moving branch.
    required: false
    default: git+https://github.com/ocensis/doc-drift-agent.git@v0

outputs:
  status:
    description: Bundle run status (clean, drift_found, stale, failed, ...).
    value: ${{ steps.gate.outputs.status }}
  exit-code:
    description: "Adapter exit code: 0 clean/fixed, 1 findings, 2 malfunction."
    value: ${{ steps.gate.outputs.exit-code }}
  blocking-count:
    description: >-
      Findings that assert a documentation defect, excluding the ones that only
      record an unverifiable claim. This is what `fail-on-drift` acts on.
    value: ${{ steps.gate.outputs.blocking-count }}
  artifacts-dir:
    description: Directory holding bundle.json, results.sarif, summary.md, pr-comment.md.
    value: ${{ steps.gate.outputs.artifacts-dir }}

runs:
  using: composite
  steps:
    # Decided before anything is installed. A branch's first push reports an
    # all-zero "before" SHA, and a tag or manual dispatch has none at all; there
    # is no committed range to compare against. Resolving that here rather than
    # inside the gate keeps the toolchain out of the skip path -- setup-uv's
    # post-job step fails the whole job if it is installed but never used,
    # which is exactly what an adopter hits on their very first push.
    - name: Resolve the baseline revision
      id: resolve
      shell: bash
      env:
        DRIFT_BASE: ${{ inputs.base != '' && inputs.base || github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if test -z "$DRIFT_BASE" || test "$DRIFT_BASE" = "0000000000000000000000000000000000000000"; then
          echo "::notice::no base revision for this event; nothing to compare against"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
        echo "base=$DRIFT_BASE" >> "$GITHUB_OUTPUT"

    - name: Install uv
      if: steps.resolve.outputs.skip != 'true'
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        python-version: "3.13"

    - name: Run the read-only drift gate
      id: gate
      shell: bash
      env:
        DRIFT_SOURCE: ${{ inputs.version }}
        DRIFT_REPO: ${{ inputs.repo }}
        DRIFT_SKIP: ${{ steps.resolve.outputs.skip }}
        DRIFT_BASE: ${{ steps.resolve.outputs.base }}
        DRIFT_SEMANTIC: ${{ inputs.semantic }}
        DRIFT_ARTIFACTS: ${{ runner.temp }}/drift-agent
        DRIFT_STATE: ${{ runner.temp }}/drift-agent-state
      run: |
        set -uo pipefail
        # Always publish the outputs, even on the paths that return early:
        # a later step reading an empty exit code cannot tell "the gate did not
        # run" from "the gate malfunctioned", and would report the wrong one.
        emit() {
          {
            echo "exit-code=$1"
            echo "status=$2"
            echo "blocking-count=$3"
            echo "artifacts-dir=$DRIFT_ARTIFACTS"
          } >> "$GITHUB_OUTPUT"
        }

        # No committed range to check is not a finding and not a malfunction.
        # The resolve step already said so and, crucially, already kept uv from
        # being installed; this step still has to publish the outputs.
        if test "$DRIFT_SKIP" = "true"; then
          emit 0 skipped 0
          exit 0
        fi

        semantic_flag=()
        if test "$DRIFT_SEMANTIC" = "true"; then
          semantic_flag=(--semantic)
        fi

        # GitHub runs composite `shell: bash` with -e, so the non-zero exit that
        # *is* the gate's answer would kill this step before it could record it.
        # The exit code is data here, not a failure.
        set +e
        # The adapter writes its four artifacts outside the worktree and never
        # calls a forge API; every GitHub-facing action below is explicit.
        uvx --from "$DRIFT_SOURCE" drift-agent ci check \
          --repo "$DRIFT_REPO" \
          --since "$DRIFT_BASE" \
          --state-dir "$DRIFT_STATE" \
          --artifacts-dir "$DRIFT_ARTIFACTS" \
          "${semantic_flag[@]}" 2>&1 | tee "$RUNNER_TEMP/drift-stdout.txt"
        code=${PIPESTATUS[0]}
        set -e

        # `q` rather than `| head -1`: `-e` is back on and `pipefail` is set, so a
        # reader that closes the pipe early would SIGPIPE sed and kill the step
        # before it records anything.
        first() { sed -n "/^$1: /{s///p;q;}" "$RUNNER_TEMP/drift-stdout.txt"; }
        status=$(first status)
        # Deliberately not defaulted: a run that could not report its blocking
        # count must not look like a run that reported zero. The policy step
        # below refuses the empty value rather than guessing.
        blocking=$(first blocking)
        emit "$code" "${status:-unknown}" "$blocking"
        exit 0

    - name: Publish the job summary
      if: always()
      shell: bash
      env:
        DRIFT_SUMMARY: ${{ steps.gate.outputs.artifacts-dir }}/summary.md
      run: |
        if test -f "$DRIFT_SUMMARY"; then
          cat "$DRIFT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi

    # Code scanning is not available on every plan (a private repository without
    # Advanced Security rejects the upload). That is a property of the
    # environment, not an answer about the documentation, so it must not decide
    # the job. The SARIF file is still archived below either way.
    - name: Upload SARIF to code scanning
      id: sarif
      if: always() && inputs.upload-sarif == 'true' && steps.gate.outputs.status != 'skipped'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.gate.outputs.artifacts-dir }}/results.sarif
        category: doc-drift

    - name: Note an unavailable code scanning upload
      if: always() && steps.sarif.outcome == 'failure'
      shell: bash
      run: |
        echo "::notice::code scanning upload unavailable; results.sarif is attached as an artifact instead"

    - name: Upload the raw artifacts
      if: always() && steps.gate.outputs.status != 'skipped'
      uses: actions/upload-artifact@v7
      with:
        # Two jobs in one workflow can both use this action, and an artifact
        # name collides across them.
        name: doc-drift-${{ github.job }}-${{ inputs.semantic }}
        if-no-files-found: warn
        path: |
          ${{ steps.gate.outputs.artifacts-dir }}/bundle.json
          ${{ steps.gate.outputs.artifacts-dir }}/results.sarif
          ${{ steps.gate.outputs.artifacts-dir }}/summary.md
          ${{ steps.gate.outputs.artifacts-dir }}/pr-comment.md

    - name: Apply the gate policy
      if: always()
      shell: bash
      env:
        DRIFT_EXIT: ${{ steps.gate.outputs.exit-code }}
        DRIFT_STATUS: ${{ steps.gate.outputs.status }}
        DRIFT_BLOCKING: ${{ steps.gate.outputs.blocking-count }}
        DRIFT_BLOCK: ${{ inputs.fail-on-drift }}
      run: |
        set -euo pipefail
        if test -z "$DRIFT_EXIT"; then
          echo "::error::the gate step never reported an exit code" >&2
          exit 1
        fi
        case "$DRIFT_EXIT" in
          0) echo "drift gate: $DRIFT_STATUS" ;;
          1)
            # A finding is a review signal. Blocking on it is the adopter's call,
            # so it stays opt-in; the SARIF annotations land either way.
            if test "$DRIFT_BLOCK" = "true"; then
              # Only a finding that asserts a defect may block. An unverifiable
              # claim is the detector's limit, not the repository's, and gating
              # merges on it would make the action unadoptable.
              if ! printf '%s' "$DRIFT_BLOCKING" | grep -Eq '^[0-9]+$'; then
                echo "::error::gate reported no blocking-finding count; refusing to guess" >&2
                exit 1
              fi
              if test "$DRIFT_BLOCKING" -gt 0; then
                echo "::error::documentation drift found ($DRIFT_STATUS, $DRIFT_BLOCKING blocking)" >&2
                exit 1
              fi
              echo "::warning::only advisory findings ($DRIFT_STATUS); not blocking"
              exit 0
            fi
            echo "::warning::documentation drift found ($DRIFT_STATUS); not blocking"
            ;;
          *)
            # stale/failed means the gate could not answer. That is never a
            # finding and must not be silently downgraded to one.
            echo "::error::drift gate malfunctioned ($DRIFT_STATUS, exit $DRIFT_EXIT)" >&2
            exit 1
            ;;
        esac
